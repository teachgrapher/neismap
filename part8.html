<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}.titles a{color:inherit; text-decoration:none; border-bottom:1px solid color-mix(in srgb, currentColor 40%, transparent)}.titles a:hover{border-bottom-color:currentColor}</style>
<!-- 나이스 매뉴얼 Part 8(보건)을 흐름 화살표가 겹쳐진 마인드맵으로 보여 주는 페이지 -->
<title>보건 마인드맵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#1B2524; --muted:#5C6966; --line:#CFD8D4;
  --a:#0F7B6C; --b:#A86300; --c:#4453A6; --d:#A5452C; --e:#56626C; --flow:#C0266D; --on:#FFFFFF; --upd:#E0A800;
  --dot:#D9E1DD;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --display:"Do Hyeon","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111816; --surface:#1A2320; --ink:#E3ECE8; --muted:#93A29E; --line:#31403C;
    --a:#43C2AC; --b:#E6A443; --c:#95A3F2; --d:#F0906F; --e:#A9B6C0; --flow:#F2649F; --on:#111816; --upd:#F5C542; --dot:#1F2A27;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111816; --surface:#1A2320; --ink:#E3ECE8; --muted:#93A29E; --line:#31403C;
  --a:#43C2AC; --b:#E6A443; --c:#95A3F2; --d:#F0906F; --e:#A9B6C0; --flow:#F2649F; --on:#111816; --upd:#F5C542; --dot:#1F2A27;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font:15px/1.6 var(--sans);
  word-break:keep-all; overflow-wrap:normal; hyphens:none;
}
.app{display:grid; grid-template-rows:auto 1fr; height:100%}
header{
  display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px 28px;
  padding:14px 20px 12px; border-bottom:1px solid var(--line); background:var(--surface);
}
.titles .eyebrow{font-size:12px; letter-spacing:.08em; color:var(--muted); font-weight:500}
.titles h1{margin:0; font:400 30px/1.1 var(--display); letter-spacing:.01em; text-wrap:balance}
.titles .src{font-size:12px; color:var(--muted)}
.flows{display:flex; flex-direction:column; gap:6px; min-width:0; flex:1 1 340px}
.flows .lab{font-size:12px; color:var(--muted); font-weight:500; letter-spacing:.04em}
.chips{display:flex; flex-wrap:wrap; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:thin}
.chip{
  flex:none; border:1px solid var(--line); background:var(--bg); color:var(--ink);
  font:500 13px/1 var(--sans); padding:8px 12px; border-radius:999px; cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--flow); border-color:var(--flow); color:var(--on)}
.chip.off[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.chip:focus-visible,.zoom button:focus-visible,.step:focus-visible{outline:2px solid var(--flow); outline-offset:2px}

main{display:grid; grid-template-columns:minmax(0,2fr) minmax(340px,1fr); min-height:0}
.themebtn{
  align-self:flex-start; margin-left:auto; display:inline-flex; align-items:center; gap:7px;
  border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:999px;
  font:500 13px/1 var(--sans); padding:8px 13px; cursor:pointer;
}
.themebtn svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round}
.themebtn:focus-visible,.srcbtn:focus-visible,.viewer button:focus-visible{outline:2px solid var(--flow); outline-offset:2px}
.srcbtn{
  margin-top:14px; display:inline-flex; align-items:center; gap:8px; cursor:pointer;
  border:1.5px solid var(--kc,var(--ink)); color:var(--ink); background:color-mix(in srgb, var(--kc,var(--ink)) 10%, var(--surface));
  border-radius:8px; padding:9px 14px; font:700 14px/1 var(--sans);
}
.srcbtn span{font:500 12.5px/1 var(--mono); color:var(--muted)}
.media{margin-top:18px; display:flex; flex-direction:column; gap:12px}
.media h3{margin:0; font-size:16px; font-weight:700}
.media figure{margin:0; display:flex; flex-direction:column; gap:4px}
.media video{display:block; width:100%; height:auto; aspect-ratio:16/9; border:1px solid var(--line); border-radius:8px; background:var(--surface)}
.media figcaption{font-size:12px; color:var(--muted)}
.yr{display:inline-block; font-size:12px; font-weight:700; color:var(--ink); background:color-mix(in srgb, var(--c) 18%, var(--surface)); border:1px solid color-mix(in srgb, var(--c) 45%, var(--line)); border-radius:6px; padding:0 6px; margin-right:2px}
.goto{margin-top:16px; display:flex; flex-direction:column; gap:8px}
.goto h3{margin:0; font-size:15px; font-weight:700}
.gobtn{display:flex; align-items:center; justify-content:space-between; gap:10px; text-decoration:none; color:var(--ink); border:1.5px dashed var(--muted); border-radius:10px; padding:10px 12px; background:var(--surface)}
.gobtn:hover{border-style:solid; border-color:var(--flow)}
.gobtn:focus-visible{outline:2px solid var(--flow); outline-offset:2px}
.gobtn small{display:block; font-size:12px; color:var(--muted)}
.gobtn b{font-size:14.5px}
.gobtn .arr{flex:none; font-weight:700; color:var(--flow)}
.viewer{display:flex; flex-direction:column; flex:1; min-height:0; background:var(--bg)}
.vhead{display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--line)}
.vhead .vt{flex:1; min-width:0}
.vcrumb{font-size:12px; color:var(--muted); letter-spacing:.03em}
.vtitle{font:400 19px/1.25 var(--display)}
.viewer button{border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px;
  font:500 13px/1 var(--sans); padding:8px 11px; cursor:pointer; flex:none}
.vbody{flex:1; overflow:auto; padding:14px; display:flex; flex-direction:column; gap:14px; align-items:flex-start}
.vbody figure{margin:0; width:100%; flex:none}
.vbody.wide figure{width:190%}
.vbody img{display:block; width:100%; height:auto; max-width:none; border:1px solid var(--line); border-radius:4px; background:#fff}
.vbody figcaption{font:500 12px/1 var(--mono); color:var(--muted); margin-top:6px}
.vbody .gapnote{font-size:12px; color:var(--muted); border-top:1px dashed var(--line); padding-top:10px; width:100%}
.vbody .more{align-self:center}
:root[data-theme="dark"] .vbody img{filter:brightness(.9)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .vbody img{filter:brightness(.9)} }

.mapwrap{position:relative; min-height:0; overflow:hidden;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.2px, transparent 1.3px); background-size:22px 22px;}
#map{width:100%; height:100%; display:block; touch-action:none; cursor:grab; user-select:none}
#map.dragging{cursor:grabbing}
.zoom{position:absolute; right:14px; top:14px; display:flex; flex-direction:column; gap:6px}
.zoom button{
  width:38px; height:38px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font:500 18px/1 var(--sans); cursor:pointer;
}
.zoom button.fit{font-size:12px}
.legend{
  position:absolute; left:14px; bottom:14px; display:flex; flex-wrap:wrap; gap:6px 14px;
  background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 12px;
  font-size:12px; color:var(--muted); max-width:calc(100% - 28px);
}
.legend span{display:inline-flex; align-items:center; gap:6px}
.sw{width:12px; height:12px; border-radius:3px; display:inline-block}
.sw.hub{background:transparent; border:2px double var(--ink)}
.sw.exit{background:transparent; border:1.5px dashed var(--muted)}
.sw.flow{height:0; width:18px; border-top:2px dashed var(--flow); border-radius:0}
.hint{position:absolute; left:14px; top:12px; font-size:12px; color:var(--muted)}

aside{border-left:1px solid var(--line); background:var(--surface); min-height:0; overflow:hidden;
  display:flex; flex-direction:column}
.tabs{display:flex; gap:4px; padding:10px 14px 0; border-bottom:1px solid var(--line); background:var(--surface); flex:none}
.tabs button{border:0; background:none; color:var(--muted); font:500 14px/1 var(--sans); padding:10px 12px 11px;
  border-bottom:2.5px solid transparent; cursor:pointer; margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--flow); font-weight:700}
.tabs button:disabled{opacity:.4; cursor:default}
.tabs button span{font:500 11.5px/1 var(--mono); color:var(--muted); margin-left:4px}
.tabs button:focus-visible{outline:2px solid var(--flow); outline-offset:-2px}
.pane{flex:1; min-height:0; overflow-y:auto; padding:20px 20px 28px; display:flex; flex-direction:column; gap:22px}
.card .crumb{font-size:12px; color:var(--muted); letter-spacing:.03em}
.card h2{margin:2px 0 8px; font:400 25px/1.2 var(--display); text-wrap:balance}
.card h2 .no{color:var(--kc,var(--ink)); margin-right:6px}
.meta{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; margin:0 0 12px; font-size:14px}
.meta dt{color:var(--muted); font-size:12px; padding-top:2px; white-space:nowrap}
.meta dd{margin:0}
.path{font:500 12.5px/1.5 var(--mono); background:var(--bg); border:1px solid var(--line);
  border-radius:6px; padding:3px 7px; display:inline-block}
.card ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px; font-size:14px}
.card p.desc{margin:0 0 10px; font-size:14.5px}
.tag{display:inline-block; font-size:11.5px; font-weight:700; padding:1px 7px; border-radius:999px;
  background:var(--kc,var(--ink)); color:var(--on); vertical-align:2px; margin-left:4px}
.flowbox h3{margin:0 0 2px; font:400 20px/1.2 var(--display); color:var(--flow)}
.flowbox p{margin:0 0 10px; font-size:13.5px; color:var(--muted)}
.flowbox ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px}
.step{
  width:100%; display:grid; grid-template-columns:24px 1fr; gap:10px; align-items:start; text-align:left;
  background:none; border:1px solid transparent; border-radius:8px; padding:7px 8px; cursor:pointer;
  color:var(--ink); font:inherit;
}
.step:hover{background:var(--bg)}
.step.cur{border-color:var(--flow)}
.step .n{width:22px; height:22px; border-radius:50%; background:var(--flow); color:var(--on);
  font:700 12px/22px var(--sans); text-align:center; font-variant-numeric:tabular-nums}
.step b{display:block; font-size:14px; font-weight:700}
.step small{display:block; font-size:12.5px; color:var(--muted); line-height:1.5}

/* SVG */
svg text{font-family:var(--sans); fill:var(--ink)}
.br-A{--k:var(--a)} .br-B{--k:var(--b)} .br-C{--k:var(--c)} .br-D{--k:var(--d)} .br-E{--k:var(--e)}
.edge{fill:none; stroke:var(--k); stroke-linecap:round; opacity:.75; transition:opacity .2s}
.node{cursor:pointer; transition:opacity .2s}
.node rect.box{fill:var(--surface); stroke:var(--line); stroke-width:1.2}
.node:focus{outline:none}
.node:focus-visible rect.box{stroke:var(--flow); stroke-width:2.5}
.t-root rect.box{fill:var(--ink); stroke:none}
.t-root text.lbl{fill:var(--bg); font-family:var(--display); font-size:24px}
.t-branch rect.box{fill:var(--k); stroke:none}
.t-branch text.lbl{fill:var(--on); font-weight:700; font-size:16px}
.t-section rect.box{fill:color-mix(in srgb, var(--k) 13%, var(--surface)); stroke:var(--k); stroke-width:1.6}
.t-section text.lbl{font-weight:700; font-size:14.5px}
.t-section rect.badge{fill:var(--k)}
.t-section text.badge{fill:var(--on); font-weight:700; font-size:12px}
.t-section text.time{fill:var(--muted); font-size:11.5px}
.t-leaf text.lbl{font-size:13.5px}
.node.hub rect.box{stroke:var(--k); stroke-width:2.2}
.node.hub rect.ring{fill:none; stroke:var(--k); stroke-width:1; opacity:.6}
.node.exit rect.box{stroke:var(--muted); stroke-dasharray:4 3; fill:var(--bg)}
rect.tagbg{fill:var(--k)} text.tagtx{fill:var(--on); font-size:11px; font-weight:700}
.node.exit rect.tagbg{fill:var(--muted)}
rect.updbg{fill:var(--upd)} text.updtx{fill:#241A00; font-size:10.5px; font-weight:800}
.chip.updchip{border-color:var(--upd)}
.chip.updchip[aria-pressed="true"]{background:var(--upd); border-color:var(--upd); color:#241A00}
.updbox{margin:12px 0; padding:10px 12px; border-left:4px solid var(--upd); background:color-mix(in srgb, var(--upd) 14%, var(--surface)); border-radius:8px}
.updbox b{display:block; margin-bottom:4px}
.updbox ul{margin:0; padding-left:18px}
.updmini{font-style:normal; font-size:11px; font-weight:800; color:#241A00; background:var(--upd); border-radius:8px; padding:0 6px; margin-left:4px}
.sw.upd{background:var(--upd)}
.node.sel rect.box{stroke:var(--ink); stroke-width:2.6}
.t-root.sel rect.box{stroke:var(--flow); stroke-width:3}
.dim{opacity:.34}
.fpath{fill:none; stroke:var(--flow); stroke-width:2.6; stroke-dasharray:7 5; stroke-linecap:round;
  animation:march 1.1s linear infinite}
#arrow path{fill:var(--flow)}
.fbadge circle{fill:var(--flow); stroke:var(--surface); stroke-width:2}
.fbadge text{fill:var(--on); font-size:11.5px; font-weight:700}
@keyframes march{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion: reduce){ .fpath{animation:none} .node,.edge{transition:none} }

@media (max-width:820px){
  html,body{height:auto}
  .app{display:block}
  header{padding:14px 16px 12px}
  .chips{flex-wrap:nowrap}
  main{display:block}
  .mapwrap{height:62vh; min-height:360px}
  aside{border-left:0; border-top:1px solid var(--line); overflow:visible}
  .pane{overflow:visible; padding:18px 16px 32px}
  .tabs{padding:8px 10px 0}
  .legend{font-size:11px; gap:4px 10px}
  .hint{display:none}
  .viewer{position:fixed; inset:0; z-index:50; border:0; padding-top:env(safe-area-inset-top,0px)}
  .themebtn{position:absolute; right:16px; top:14px}
  .vbody.wide figure{width:300%}
  header{position:relative}
}
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="titles">
      <div class="eyebrow"><a href="index.html">← 나이스 지도 전체</a> · PART Ⅷ</div>
      <h1>보건</h1>
      <div class="src">2026 하반기 교무업무 사용자 설명서(고등학교용) 2권 · <a href="pdf/part8.pdf" download="2026_나이스_보건_마인드맵_연수자료.pdf">연수자료 PDF</a></div>
    </div>
    <div class="flows">
      <div class="lab">흐름 겹쳐 보기</div>
      <div class="chips" id="chips"></div>
    </div>
    <button type="button" class="themebtn" id="theme"></button>
  </header>
  <main>
    <div class="mapwrap">
      <svg id="map" aria-label="Part 8 보건 마인드맵">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z"></path>
          </marker>
        </defs>
        <g id="viewport"><g id="content">
          <g id="edges"></g><g id="flowlayer"></g><g id="nodes"></g><g id="badges"></g>
        </g></g>
      </svg>
      <div class="hint">끌어서 이동 · 휠로 확대 · 가지를 누르면 설명</div>
      <div class="zoom">
        <button type="button" id="zin" aria-label="확대">+</button>
        <button type="button" id="zout" aria-label="축소">−</button>
        <button type="button" id="zfit" class="fit" aria-label="화면에 맞추기">맞춤</button>
      </div>
      <div class="legend" id="legend">
        <span><i class="sw hub"></i>허브</span>
        <span><i class="sw exit"></i>다른 파트로</span>
        <span><i class="sw flow"></i>업무 흐름</span>
      </div>
    </div>
    <aside>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabInfo" aria-selected="true">설명</button>
        <button type="button" role="tab" id="tabSrc" aria-selected="false">매뉴얼 원문<span id="tabPages"></span></button>
      </div>
      <div class="pane" id="infoPane">
        <section class="card" id="detail" aria-live="polite"></section>
        <section class="flowbox" id="flowbox"></section>
      </div>
      <section class="viewer" id="viewer" hidden aria-label="매뉴얼 원문">
      <div class="vhead">
        <div class="vt"><div class="vcrumb" id="vcrumb">매뉴얼 원문</div><div class="vtitle" id="vtitle"></div></div>
        <button type="button" id="vwide" aria-pressed="false">크게 보기</button>
        <button type="button" id="vclose">닫기 ✕</button>
      </div>
      <div class="vbody" id="vbody"></div>
    </section>
    </aside>
  </main>
</div>

<script>
// ───── 데이터: 이 객체만 바꾸면 다른 파트도 같은 틀로 그릴 수 있음 ─────
const PART = {
  id:'root', label:'보건', part:'Part Ⅷ', pages:'p.1193–1224',
  countText:'Section 2개(11개 장)를',
  summary:'학생 건강기록부에 인적사항·신체발달·신체능력·건강검진·별도검사를 입력하고, 학년말에 자료검증·마감·결재로 닫은 뒤 오류는 정정대장으로 고치는 파트입니다. 감염병 환자가 생기면 등록하고 에듀파인 기안과 교육청 보고서로 신고하며 발생 통계를 관리합니다. Section 1(건강기록부 관리)과 Section 2(감염병 환자 관리)를 장 단위로 나눠 네 갈래로 묶었습니다.',
  branches:[
  {id:'A', side:'right', label:'건강기록 입력', desc:'학년초 반 단위로 인적사항을 만들고 검사 결과를 한꺼번에 넣거나, 전입생 등 한 명씩 입력하는 가지입니다. Section 1의 1~2장.',
   sections:[
    {id:'S11', no:'1-1', label:'반별 등록', time:'학년초·검사 후', pages:'1193–1197',
     who:'학급담임교사, 보건교사', path:'보건-건강기록부관리-반별등록',
     points:['학기 초 편성된 학급 명렬표로 반 전체를 한 번에 입력','같은 검사일정·검사기관을 반에 똑같이 적용할 때 쓰고, 입력 요령은 개인별 등록과 같음'],
     leaves:[
      {id:'p11a', label:'인적사항 생성(학년초)', pages:'1193–1194',

const H={root:58,branch:42,section:38,leaf:32};
const X={branch:150,section:320,leaf:540};
const GAP={leaf:PART.leafGap||42,section:24,branch:46};

function register(){
  nodes.root={id:'root',type:'root',label:PART.label,side:'c',data:PART};
  PART.branches.forEach(b=>{
    nodes[b.id]={id:b.id,type:'branch',br:b.id,label:b.label,side:b.side,parent:'root',data:b};
    b.sections.forEach(s=>{
      nodes[s.id]={id:s.id,type:'section',br:b.id,label:s.label,side:b.side,parent:b.id,data:s};
      s.leaves.forEach(l=>{nodes[l.id]={id:l.id,type:'leaf',br:b.id,label:l.label,side:b.side,parent:s.id,data:l};});
    });
  });
}
function layoutY(){
  ['right','left'].forEach(side=>{
    let y=0; const brs=PART.branches.filter(b=>b.side===side);
    brs.forEach((b,bi)=>{
      if(bi) y+=GAP.branch-GAP.section;
      b.sections.forEach((s,si)=>{
        if(si||bi) y+=GAP.section;
        s.leaves.forEach((l,li)=>{ if(li) y+=GAP.leaf; nodes[l.id].cy=y; });
        const ys=s.leaves.map(l=>nodes[l.id].cy); nodes[s.id].cy=(ys[0]+ys[ys.length-1])/2;
      });
      const ys=b.sections.map(s=>nodes[s.id].cy); nodes[b.id].cy=(ys[0]+ys[ys.length-1])/2;
    });
    const shift=-y/2;
    Object.values(nodes).filter(n=>n.side===side).forEach(n=>n.cy+=shift);
  });
  nodes.root.cy=0;
}
function drawNode(n){

function drawEdges(){

    const e=el('path',{class:`edge br-${n.br}`,d:`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`,'stroke-width':sw,'data-edge':n.id});

  });

function clip(n,tx,ty){ // 노드 상자 경계와 (중심→목표) 선분의 교점

function drawFlow(){

  const f=upd?null:PART.flows.find(f=>f.id===curFlow);
  const keep=new Set();
  if(upd) updNodes().forEach(n=>ancestors(n.id).forEach(i=>keep.add(i)));
  if(f){
    f.steps.forEach(s=>ancestors(s.node).forEach(i=>keep.add(i)));
    f.steps.forEach((s,i)=>{
      const n=nodes[s.node];
      if(i<f.steps.length-1){
        const m=nodes[f.steps[i+1].node];
        const ax=n.x+n.w/2, ay=n.cy, bx=m.x+m.w/2, by=m.cy;
        const dx=bx-ax, dy=by-ay, d=Math.hypot(dx,dy), k=Math.min(0.32, 60/d+0.12);
        const side=n.side==='left'?-1:1;
        const qx=(ax+bx)/2 - dy/d*d*k*side, qy=(ay+by)/2 + dx/d*d*k*side;
        const [sx,sy]=clip(n,qx,qy), [ex,ey]=clip(m,qx,qy);

      const bx=n.side==='left'?n.x+n.w:n.x, by=n.cy-n.h/2;

const svg=$('#map'), vp=$('#viewport'); let V={x:0,y:0,k:1};

function zoomAt(px,py,f){const k2=Math.max(.2,Math.min(3,V.k*f)); V.x=px-(px-V.x)*k2/V.k; V.y=py-(py-V.y)*k2/V.k; V.k=k2; apply();}

svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*0.0015));},{passive:false});
svg.addEventListener('keydown',e=>{ const nd=e.target.closest&&e.target.closest('[data-node]'); if(nd&&(e.key==='Enter'||e.key===' ')){e.preventDefault(); select(nd.dataset.node,false);} });
$('#zin').onclick=()=>zoomAt(svg.clientWidth/2,svg.clientHeight/2,1.25);
$('#zout').onclick=()=>zoomAt(svg.clientWidth/2,svg.clientHeight/2,0.8);
$('#zfit').onclick=fit;
addEventListener('resize',()=>{fit(); focusFlow();});
function focusFlow(){ // 화면이 좁아 글자가 너무 작아지면 현재 흐름 쪽으로 확대
  if(V.k>=0.62||svg.clientWidth>=700) return; // 넓은 화면은 전체 지도를 그대로 둠
  const f=PART.flows.find(x=>x.id===curFlow); if(!f) return;
  const ns=f.steps.map(s=>nodes[s.node]);
  const x0=Math.min(...ns.map(n=>n.x)), x1=Math.max(...ns.map(n=>n.x+n.w)), y0=Math.min(...ns.map(n=>n.cy)), y1=Math.max(...ns.map(n=>n.cy));
  const W=svg.clientWidth,Hh=svg.clientHeight;
  V.k=Math.max(0.62,Math.min(1,W/(x1-x0+80),Hh/(y1-y0+120)));
  V.x=W/2-(x0+x1)/2*V.k; V.y=Hh/2-(y0+y1)/2*V.k; apply();
}

// ───── 매뉴얼 원문 보기 ─────
const PAGE_SRC=window.PAGE_SRC||{};
const PAGE_MIN=1193, PAGE_MAX=1224, IMG_W=1752, IMG_H=1240;
let vPages=[], vNode=null;
function parsePages(str){ // '21–24, 33–34' → [21,22,23,24,33,34]
  const out=new Set();
  String(str).split(',').forEach(part=>{
    const [a,b]=part.trim().split(/[–-]/).map(Number);
    for(let i=a;i<=(b||a);i++) if(i>=PAGE_MIN&&i<=PAGE_MAX) out.add(i);
  });
  return [...out].sort((x,y)=>x-y);
}
const pad2=n=>String(n).padStart(2,'0');
function openViewer(n){
  vNode=n; vPages=parsePages(n.data.pages);
  $('#vcrumb').textContent=`매뉴얼 원문 · p.${n.data.pages}`;
  $('#vtitle').textContent=(n.type==='section'?(n.data.no||n.id)+' ':'')+n.label;
  const wasHidden=$('#viewer').hidden;
  $('#viewer').hidden=false; $('#infoPane').hidden=true; setTabs(true);
  drawPages(true);
  if(wasHidden) $('#tabSrc').focus({preventScroll:true});
}
function drawPages(toTop){
  const b=$('#vbody'); const first=vPages[0], last=vPages[vPages.length-1];
  let h='';
  if(first>PAGE_MIN) h+=`<button type="button" class="more" data-add="${first-1}">‹ 앞 쪽(p.${first-1}) 더 보기</button>`;
  vPages.forEach((pg,i)=>{
    if(i&&pg!==vPages[i-1]+1) h+=`<div class="gapnote">p.${vPages[i-1]+1}–${pg-1} 건너뜀</div>`;
    h+=`<figure id="pg${pg}"><img src="${PAGE_SRC[pg]||`pages8/p-${pad2(pg)}.jpg`}" width="${IMG_W}" height="${IMG_H}" loading="lazy" alt="매뉴얼 ${pg}쪽"><figcaption>p.${pg}</figcaption></figure>`;
  });
  if(last<PAGE_MAX) h+=`<button type="button" class="more" data-add="${last+1}">다음 쪽(p.${last+1}) 더 보기 ›</button>`;
  b.innerHTML=h;
  b.querySelectorAll('[data-add]').forEach(btn=>btn.onclick=()=>{
    const pg=+btn.dataset.add; vPages=[...new Set([...vPages,pg])].sort((x,y)=>x-y); drawPages(false);
    const f=$('#pg'+pg); if(f) f.scrollIntoView({block:'nearest'});
  });
  if(toTop) b.scrollTop=0;
}
function closeViewer(){
  $('#viewer').hidden=true; $('#infoPane').hidden=false; setTabs(false);
}
function setTabs(src){
  $('#tabInfo').setAttribute('aria-selected',String(!src)); $('#tabSrc').setAttribute('aria-selected',String(src));
  const n=nodes[selId], pg=(n&&n.data.pages)||(vNode&&vNode.data.pages);
  $('#tabPages').textContent=pg?` p.${String(pg).replace(/^p\./,'')}`:''; $('#tabSrc').disabled=!pg; $('#tabSrc').hidden=!!window.NO_PAGES;
}
$('#tabInfo').onclick=closeViewer;
$('#tabSrc').onclick=()=>{ const n=nodes[selId]; if(n.data.pages) openViewer(n); else if(vNode) openViewer(vNode); };
$('#vclose').onclick=closeViewer;
$('#vwide').onclick=()=>{ const on=$('#vbody').classList.toggle('wide'); $('#vwide').setAttribute('aria-pressed',String(on)); $('#vwide').textContent=on?'폭 맞춤':'크게 보기'; };
addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#viewer').hidden) closeViewer(); });

// ───── 밝게/어둡게 ─────
const ROOT=document.documentElement;
try{ const saved=localStorage.getItem('nicemap-theme'); if(saved) ROOT.setAttribute('data-theme',saved); }catch(e){}
function effTheme(){ return ROOT.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); }
const ICON={
  dark:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  light:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
};
function themeLabel(){ const next=effTheme()==='dark'?'light':'dark';
  $('#theme').innerHTML=ICON[next]+(next==='dark'?'어둡게':'밝게');
  $('#theme').setAttribute('aria-label',next==='dark'?'다크 모드로 바꾸기':'라이트 모드로 바꾸기'); }
$('#theme').onclick=()=>{ const t=effTheme()==='dark'?'light':'dark'; ROOT.setAttribute('data-theme',t);
  try{localStorage.setItem('nicemap-theme',t);}catch(e){} themeLabel(); };
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeLabel); }catch(e){}
new MutationObserver(themeLabel).observe(ROOT,{attributes:true,attributeFilter:['data-theme']});
themeLabel();

// ───── 시작 ─────
function chips(){
  const c=$('#chips');
  c.innerHTML=PART.flows.map(f=>`<button type="button" class="chip" data-flow="${f.id}">${esc(f.label)}</button>`).join('')
    +(updNodes().length?'<button type="button" class="chip updchip" data-flow="upd">9.11 기능개선</button>':'')
    +'<button type="button" class="chip off" data-flow="none">흐름 끄기</button>';
  c.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
    curFlow=b.dataset.flow==='none'?null:b.dataset.flow; drawFlow();
    const f=PART.flows.find(x=>x.id===curFlow); if(f) select(f.steps[0].node,true);
    else if(curFlow==='upd') select(updNodes()[0].id,true);
  }));
}
async function start(){
  try{ await document.fonts.ready; }catch(e){}
  register(); layoutY();
  Object.values(nodes).forEach(drawNode);
  drawEdges();
  $('#legend').insertAdjacentHTML('afterbegin',PART.branches.map(b=>`<span><i class="sw" style="background:${BR_VAR[b.id]}"></i>${esc(b.label)}</span>`).join(''));
  if(updNodes().length) $('#legend').insertAdjacentHTML('beforeend','<span><i class="sw upd"></i>9.11 기능개선</span>');
  chips(); curFlow='f1'; drawFlow(); renderDetail(); fit(); focusFlow();
  const goHash=()=>{ const id=decodeURIComponent(location.hash.slice(1)); if(id&&nodes[id]){ curFlow=null; drawFlow(); select(id,true); } };
  goHash(); window.addEventListener('hashchange',goHash);
}
start();
</script>
